run_id: mind2web-guardrail
strategies: [flat_elements, axtree, pruned_html, adaptive, system_adaptive]
models:
  - name: deepseek-chat
    max_tokens: 2048
  - name: deepseek-reasoner
    max_tokens: 2048
tasks:
  source: mind2web_offline
  options:
    backend: hf
    split: test_website   # 177 tasks — mid-sized generalization split
    limit: 50             # start here; raise or remove for the full split
max_steps: 15
token_count: approx       # deepseek has no exact counter; use `exact` only with an Anthropic model
