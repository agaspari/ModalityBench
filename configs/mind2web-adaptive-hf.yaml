# Real Mind2Web (hf backend) — the Act 2 router-economics run on actual web pages, where
# observation is 93-98% of billed input tokens (vs ~4% on MiniWoB). This is where adaptive
# should escalate on extraction legs and match axtree/pruned accuracy at fewer mean tokens.
#
# osunlp/Mind2Web is public (no HF token). Only the `train` split loads via HF datasets
# (test_* splits ship inside test.zip, not auto-exposed). First run downloads the FULL train
# split (~GB, several minutes) and caches it in HF_HOME; `limit` is applied after loading.
#
# Deps: datasets (already installed). If missing: pip install 'modalitybench[data]'.
run_id: mind2web-adaptive-hf
strategies: [flat_elements, axtree, pruned_html, adaptive]
models:
  - name: deepseek-chat      # cheap + already validated; swap to claude-opus-4-8 for exact tokens
    max_tokens: 2048
tasks:
  source: mind2web_offline
  options:
    backend: hf
    split: train
    limit: 10
max_steps: 15
token_count: approx          # deepseek has no exact counter; use `exact` only with an Anthropic model
